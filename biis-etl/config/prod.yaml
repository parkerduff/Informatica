database:
  driver: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
  host: "biis-sqlserver.internal.example.gov"
  port: 1433
  name: "biis_prod"
  schema: "dbo"
  user: ""        # resolved via AWS Secrets Manager
  password: ""    # resolved via AWS Secrets Manager

secrets:
  provider: "aws"
  region: "us-east-1"

notifications:
  provider: "ses"
  region: "us-east-1"
  sender: "biis-etl@example.gov"
  recipients: "biis-ops@example.gov"

paths:
  landing: "/data/biis/landing"
  staging: "/data/biis/staging"
  archive: "/data/biis/archive"

sftp:
  host: "m1csv301.example.gov"
  port: 22
  user: "sa-cdirect"
  password: ""    # resolved via AWS Secrets Manager
  routes:
    nih_cpm: "/opt/app/jail/sa-nihbiisu/outbound"
    nih_les: "/opt/app/jail/sa-nihbiisu/outbound"
    oig: "/opt/app/jail/sa-oigbiisu/outbound"
    cdc: "/opt/app/jail/sa-cdcbiisu/outbound"
    fda: "/opt/app/jail/sa-fdabiisu/outbound"
    afps: "/opt/app/jail/sa-afpsbiisu/outbound"
