services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "TestP@ssw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TestP@ssw0rd!" -Q "SELECT 1" -C
      interval: 10s
      retries: 10
      start_period: 30s
  localstack:
    image: localstack/localstack
    ports: ["4566:4566"]
    environment:
      SERVICES: "s3,secretsmanager"
  sftp:
    image: atmoz/sftp
    ports: ["2222:22"]
    command: "testuser:testpass:::outbound"
  airflow:
    image: apache/airflow:2.8.1-python3.11
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: "/opt/airflow/dags"
    volumes:
      - ./dags:/opt/airflow/dags
    ports: ["8080:8080"]
    command: airflow standalone
