services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      SA_PASSWORD: "TestP@ssw0rd!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports: ["1433:1433"]
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "TestP@ssw0rd!" -Q "SELECT 1" -C
      interval: 10s
      retries: 10
      start_period: 30s
