[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biis-etl"
version = "1.0.0"
description = "BIIS ETL - Informatica PowerCenter to PySpark migration"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "functional: end-to-end tests requiring Docker SQL Server",
    "regression: golden dataset comparison tests",
    "performance: benchmark tests",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_strict_optional = true
exclude = ["build", "venv"]

[tool.coverage.run]
source = ["jobs", "utils", "transfers"]
omit = ["jobs/ehrp2biis/preload.py"]
