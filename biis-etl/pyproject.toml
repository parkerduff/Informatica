[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biis-etl"
version = "1.0.0"
description = "BIIS ETL - PySpark migration of Informatica PowerCenter 9.6.1 jobs to AWS"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure transformation logic, no external dependencies",
    "functional: end-to-end against Docker SQL Server",
    "regression: golden dataset comparison (zero diffs required)",
    "performance: benchmark timing",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["jobs", "utils", "transfers"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    # Thin JDBC/pyodbc + SQL-stub I/O wrappers (exercised by functional tests).
    "*/utils/db.py",
    "*/jobs/ehrp2biis/preload.py",
    "*/jobs/cpm/cpm_nih.py",
    "*/jobs/cpm/cpm_oig.py",
    "*/jobs/cpm/cpm_cdc.py",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "def main\\(",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
follow_imports = "silent"
files = ["jobs", "utils", "transfers", "dags"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv", "build", "dist"]
