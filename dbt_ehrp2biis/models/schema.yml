version: 2

sources:
  - name: ehrp
    description: PeopleSoft EHRP source tables containing government employee HR data
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema_ehrp') }}"
    tables:
      - name: ps_gvt_job
        description: PeopleSoft government job records with employee position, grade, salary, and leave information
        columns:
          - name: emplid
            description: Employee ID
          - name: empl_rcd
            description: Employment record number
          - name: effdt
            description: Effective date of the action
          - name: effseq
            description: Effective sequence number

      - name: ps_gvt_employment
        description: Employment dates, tenure, and probation information
        
      - name: ps_gvt_pers_nid
        description: Personal national ID (SSN) information
        
      - name: ps_gvt_pers_data
        description: Personal data including name, address, and demographics
        
      - name: ps_gvt_awd_data
        description: Award and bonus information
        
      - name: ps_gvt_citizenship
        description: Citizenship status information
        
      - name: ps_he_fill_pos
        description: Position filling codes
        
      - name: ps_jpm_jp_items
        description: Education level and instructional program codes
        
      - name: ps_gvt_ee_data_trk
        description: Employee data tracking information

  - name: nknight
    description: NKNIGHT schema tables for EHRP2BIIS processing
    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema_nknight') }}"
    tables:
      - name: nwk_new_ehrp_actions_tbl
        description: Trigger table identifying which employee actions need processing
        columns:
          - name: emplid
            description: Employee ID
          - name: empl_rcd
            description: Employment record number
          - name: effdt
            description: Effective date
          - name: effseq
            description: Effective sequence

      - name: sequence_num_tbl
        description: Sequence number table for event ID generation
        columns:
          - name: ehrp_year
            description: Year for sequence tracking
          - name: ehrp_seq_number
            description: Last used sequence number for the year

models:
  - name: stg_ps_gvt_job
    description: Staged PeopleSoft government job records with basic transformations
    columns:
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: empl_rcd
        description: Employment record number
        tests:
          - not_null
      - name: effdt
        description: Effective date of the action
        tests:
          - not_null
      - name: effseq
        description: Effective sequence number
        tests:
          - not_null
      - name: effdt_year
        description: Year extracted from effective date for sequence generation

  - name: stg_nwk_new_ehrp_actions
    description: Staged trigger table records
    columns:
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: empl_rcd
        description: Employment record number
        tests:
          - not_null
      - name: effdt
        description: Effective date
        tests:
          - not_null
      - name: effseq
        description: Effective sequence
        tests:
          - not_null

  - name: int_sequence_generation
    description: Intermediate model that joins source data with trigger table and generates event IDs
    columns:
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: event_id
        description: Generated unique event ID
        tests:
          - not_null
          - unique

  - name: int_employee_enrichment
    description: Intermediate model with all lookup enrichments applied
    columns:
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: event_id
        description: Generated unique event ID
        tests:
          - not_null
          - unique

  - name: fct_action_primary
    description: Primary employee action data mart table (equivalent to NWK_ACTION_PRIMARY_TBL)
    columns:
      - name: event_id
        description: Unique event identifier
        tests:
          - not_null
          - unique
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: agcy_assign_cd
        description: Agency assignment code (COMPANY || GVT_SUB_AGENCY)
        tests:
          - not_null
      - name: effective_dte
        description: Effective date of the action
        tests:
          - not_null
      - name: load_date
        description: Date the record was loaded
        tests:
          - not_null
      - name: ann_lv_cur_bal_hrs
        description: Annual leave current balance hours (NULL if zero)
      - name: sick_lv_cur_bal_hrs
        description: Sick leave current balance hours (NULL if zero)
      - name: base_hrs
        description: Base hours calculated from work schedule

  - name: fct_action_secondary
    description: Secondary employee action data mart table (equivalent to NWK_ACTION_SECONDARY_TBL)
    columns:
      - name: event_id
        description: Unique event identifier linking to primary table
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_action_primary')
              field: event_id
      - name: retnd1_step_cd
        description: Retained step code (NULL if '0.0000000000000')
      - name: tsp_vesting_cd
        description: TSP vesting code
      - name: load_date
        description: Date the record was loaded
        tests:
          - not_null

  - name: fct_tracking
    description: Tracking table for processed EHRP records (equivalent to EHRP_RECS_TRACKING_TBL)
    columns:
      - name: biis_event_id
        description: BIIS event identifier
        tests:
          - not_null
          - unique
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: empl_rcd
        description: Employment record number
        tests:
          - not_null
      - name: effdt
        description: Effective date
        tests:
          - not_null
      - name: effseq
        description: Effective sequence
        tests:
          - not_null
      - name: gvt_wip_status
        description: WIP status code
      - name: noa_cd
        description: Nature of Action code
      - name: load_date
        description: Date the record was loaded
        tests:
          - not_null

  - name: hist_action_primary
    description: Historical action primary table for daily appends (equivalent to ACTION_PRIMARY_ALL)
    columns:
      - name: event_id
        description: Unique event identifier
        tests:
          - not_null
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: load_date
        description: Date the record was loaded
        tests:
          - not_null
      - name: inserted_at
        description: Timestamp when the record was inserted into the historical table
        tests:
          - not_null

  - name: reconciliation_report
    description: Reconciliation report comparing record counts across source, staging, and mart models
    columns:
      - name: layer
        description: Data layer (source, staging, intermediate, mart)
        tests:
          - not_null
      - name: model_name
        description: Name of the model or table
        tests:
          - not_null
      - name: record_count
        description: Number of records in the model
        tests:
          - not_null
