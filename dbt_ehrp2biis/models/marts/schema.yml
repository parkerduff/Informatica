version: 2

models:
  - name: fct_action_primary
    description: >
      Primary employee action data table that replicates the NWK_ACTION_PRIMARY_TBL target 
      from the Informatica EHRP2BIIS_UPDATE pipeline. Contains 200+ fields of employee 
      personnel action data including agency codes, leave balances, salary information, 
      and personal data.
    columns:
      - name: event_id
        description: "Unique identifier for the personnel action event"
        tests:
          - unique
          - not_null
      - name: emplid
        description: "Employee ID from PeopleSoft"
      - name: agcy_assign_cd
        description: "Agency assignment code (COMPANY || GVT_SUB_AGENCY)"
        tests:
          - not_null
      - name: eff_dte
        description: "Effective date of the action"
        tests:
          - not_null
      - name: noa_cd
        description: "Nature of Action code"
      - name: ssn
        description: "Social Security Number (from lkp_PS_GVT_PERS_NID lookup)"
      - name: base_hrs
        description: "Base hours calculated as: IIF(GVT_WORK_SCHED='I', STD_HOURS, STD_HOURS*2)"
      - name: load_date
        description: "Date the record was loaded"
        tests:
          - not_null

  - name: fct_action_secondary
    description: >
      Secondary action data table that replicates the NWK_ACTION_SECONDARY_TBL target 
      from the Informatica pipeline. Contains TSP, leave, and bonus details linked to 
      the primary action table via EVENT_ID.
    columns:
      - name: event_id
        description: "Unique identifier linking to fct_action_primary"
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('fct_action_primary')
              field: event_id
      - name: load_date
        description: "Date the record was loaded"
        tests:
          - not_null

  - name: fct_tracking
    description: >
      Tracking table that replicates the EHRP_RECS_TRACKING_TBL target from the 
      Informatica pipeline. Tracks processed EHRP records with their event IDs 
      for audit and reconciliation purposes.
    columns:
      - name: biis_event_id
        description: "Generated BIIS event ID"
        tests:
          - unique
          - not_null
      - name: emplid
        description: "Employee ID"
        tests:
          - not_null
      - name: empl_rcd
        description: "Employee record number"
        tests:
          - not_null
      - name: effdt
        description: "Effective date"
        tests:
          - not_null
      - name: effseq
        description: "Effective sequence"
        tests:
          - not_null
      - name: load_date
        description: "Date the record was loaded"
        tests:
          - not_null

  - name: hist_action_primary
    description: >
      Historical table that appends daily records from fct_action_primary to maintain 
      a complete history. Equivalent to action_primary_all in the original system.
    columns:
      - name: event_id
        description: "Unique identifier for the personnel action event"
        tests:
          - not_null

  - name: hist_action_secondary
    description: >
      Historical table that appends daily records from fct_action_secondary to maintain 
      a complete history. Equivalent to action_secondary_all in the original system.
    columns:
      - name: event_id
        description: "Unique identifier linking to hist_action_primary"
        tests:
          - not_null

  - name: hist_action_remarks
    description: >
      Historical table for action remarks. Equivalent to action_remarks_all in the 
      original system. Remarks are generated by stored procedures after the main ETL load.
    columns:
      - name: event_id
        description: "Event ID linking to the action"
      - name: remark_seq
        description: "Sequence number for multiple remarks per event"
