version: 2

models:
  - name: fct_action_primary
    description: >
      Fact table containing primary personnel action records. This is the main output
      table that replicates NWK_ACTION_PRIMARY_TBL from the Oracle implementation.
      Contains 260 fields covering employee demographics, position, pay, leave, and benefits.
    columns:
      - name: event_id
        description: Unique event identifier (BIIS_EVENT_ID)
        tests:
          - not_null
          - unique
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: load_date
        description: Date the record was loaded
        tests:
          - not_null

  - name: fct_action_secondary
    description: >
      Fact table containing secondary personnel action attributes. This replicates
      NWK_ACTION_SECONDARY_TBL from the Oracle implementation with 209 fields.
    columns:
      - name: event_id
        description: Unique event identifier linking to fct_action_primary
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('fct_action_primary')
              field: event_id

  - name: fct_action_remarks
    description: >
      Fact table containing action remarks. Generated by the stored procedure
      conversions that create remarks for standard and 900-series actions.
    columns:
      - name: event_id
        description: Unique event identifier linking to fct_action_primary
        tests:
          - not_null
      - name: remark_seq
        description: Sequence number for multiple remarks per event
        tests:
          - not_null

  - name: fct_ehrp_recs_tracking
    description: >
      Tracking table for EHRP record processing status. Replicates EHRP_RECS_TRACKING_TBL
      from the Oracle implementation with 10 fields tracking load status and WIP changes.
    columns:
      - name: biis_event_id
        description: Unique event identifier
        tests:
          - not_null
          - unique
      - name: emplid
        description: Employee ID
        tests:
          - not_null
      - name: load_date
        description: Date the record was loaded
        tests:
          - not_null
