name: 'dbt_ehrp2biis'
version: '1.0.0'
config-version: 2

profile: 'ehrp2biis'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  ehrp_schema: 'EHRP'
  nknight_schema: 'NKNIGHT'
  histdba_schema: 'HISTDBA'
  info_target_schema: 'INFO_TARGET_DEV'

models:
  dbt_ehrp2biis:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    validation:
      +materialized: view
      +schema: validation
