[project]
name = "biis-pyspark-etl"
version = "0.1.0"
description = "PySpark migration of the BIIS / EHRP Informatica PowerCenter ETL jobs"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.4",
    "oracledb>=1.3",
    "paramiko>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
biis-etl = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
packages = [
    "config",
    "config.schemas",
    "transforms",
    "utils",
    "jobs",
]
